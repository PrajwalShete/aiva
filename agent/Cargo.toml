[package]
name = "aiva"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "Talk to your AI about the code on your computer, from anywhere."
repository = "https://github.com/PrajwalShete/aiva"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = "0.12.0"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hostname = "0.4.2"
ignore = "0.4.33"
indicatif = "0.18.6"
libc = "0.2.190"
regex = "1.13.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.27.1"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
