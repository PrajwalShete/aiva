# Builds the aiva agent for macOS, Linux and Windows when a version tag (v1.2.3) is pushed, and
# attaches the binaries + .sha256 files to a GitHub release. install.sh and install.ps1 download
# them through https://aiva.prajwalshete.com/dl/<version>/<asset>, which serves them from here.
# Windows ships two files: aiva-windows-<arch>.exe and aivaw-windows-<arch>.exe (the window-less
# background launcher).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: aiva-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: aiva-darwin-x64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: aiva-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: aiva-linux-arm64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, asset: aiva-windows-x64 }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, asset: aiva-windows-arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Clang for ring (Windows ARM64)
        if: matrix.runner == 'windows-11-arm'
        run: command -v clang || { choco install llvm -y --no-progress && echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"; }
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: agent
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: |
          cp agent/target/${{ matrix.target }}/release/aiva ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          launcher="${{ matrix.asset }}"; launcher="aivaw-${launcher#aiva-}"
          cp agent/target/${{ matrix.target }}/release/aiva.exe ${{ matrix.asset }}.exe
          cp agent/target/${{ matrix.target }}/release/aivaw.exe "$launcher.exe"
          for f in ${{ matrix.asset }}.exe "$launcher.exe"; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}*
            aivaw-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aiva-* aivaw-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
