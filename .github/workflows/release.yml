# Builds the aiva agent for macOS and Linux when a version tag (v1.2.3) is pushed, and attaches
# the binaries + .sha256 files to a GitHub release. install.sh downloads them through
# https://aiva.prajwalshete.com/dl/<version>/<asset>, which redirects here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: aiva-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: aiva-darwin-x64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: aiva-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: aiva-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: agent
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          cp agent/target/${{ matrix.target }}/release/aiva ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aiva-* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
